name: Release Packaging

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to read from package.json)"
        required: false
        default: ""
      publish_release:
        description: "Publish assets to GitHub Releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Resolve Release Version
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".StartsWith("v")) {
              $ver = "${{ github.ref_name }}".TrimStart("v", "V")
            } else {
              $ver = [string]$pkg.version
            }
          } else {
            $ver = $ver.TrimStart("v", "V")
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: $ver (tag: v$ver)"

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build native C# helpers & XMStudioHost
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-native.ps1

      - name: Build renderer & watermarker bundles
        run: npm run build

      - name: Run unit & integration test suites
        run: npm test

      - name: Package Native WebView2 application
        run: npm run package

      - name: Build NSIS installer & SHA256SUMS.txt
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -Version "${{ steps.meta.outputs.version }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: XM-Editing-Studio-${{ steps.meta.outputs.version }}-Windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $setup = "artifacts/release/XM-Editing-Studio-${{ steps.meta.outputs.version }}-Windows-x64-Setup.exe"
          $sums = "artifacts/release/SHA256SUMS.txt"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sums --clobber
            gh release edit $tag --title "XM Editing Studio $tag" --notes-file CHANGELOG.md
          } else {
            gh release create $tag $setup $sums --target "${{ github.sha }}" --title "XM Editing Studio $tag" --notes-file CHANGELOG.md
          }
